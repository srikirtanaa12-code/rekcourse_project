<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Rekcourse Hub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style >
        .forgot-form {
            width: 100%;
            max-width: 400px;
            margin: 100px auto;
            background: linear-gradient(to top, rgba(2, 60, 80, 0.8) 50%, rgba(2, 60, 80, 0.8) 50%);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
        }
        .forgot-form h2 {
            color: #ffffff;
            font-size: 28px;
            margin-bottom: 20px;
        }
        .forgot-form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: none;
            border-radius: 5px;
            outline: none;
        }
        .forgot-form .btnn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #1b769a;
            color: rgb(255, 255, 255);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .forgot-form .btnn:hover {
            background: rgb(8, 82, 119);
            color: #06445d;
        }
        .forgot-form p {
            color: rgb(0, 80, 103);
            margin-top: 15px;
        }
        .forgot-form a {
            color: #ffffff;
            text-decoration: none;
        }
        .forgot-form a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body bgcolor="black">
    <div class="main" style="height: 100vh; display: flex; align-items: center; justify-content: center;">
        
        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-messages" style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 400px; text-align: center; z-index: 1000;">
              {% for category, message in messages %}
                <div class="alert alert-{{ category }}" style="padding: 10px; margin-bottom: 10px; border-radius: 5px; background-color: {% if category == 'error' %}#f8d7da{% else %}#d4edda{% endif %}; color: {% if category == 'error' %}#721c24{% else %}#155724{% endif %}; border: 1px solid {% if category == 'error' %}#f5c6cb{% else %}#c3e6cb{% endif %};">
                  {{ message }}
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form class="forgot-form" action="/forgot_password" method="POST">
            <h2>Forgot Password</h2>
            <p style="margin-bottom: 20px; color: #ccc;">Enter your email to reset your password.</p>
            <input type="email" name="email" placeholder="Enter Your Email" required>
            <button type="submit" class="btnn">Continue</button>
            <p><a href="/">Back to Login</a></p>
        </form>

    </div>
</body>
</html>
