<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Rekcourse Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #e2e8f0; min-height: 100vh; padding: 40px; }
        .dashboard-container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .header h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, #7c3aed, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-logout { padding: 10px 20px; background: rgba(255,255,255,0.1); border-radius: 8px; color: white; text-decoration: none; font-weight: 600; transition: background 0.2s; }
        .btn-logout:hover { background: rgba(255,255,255,0.2); }
        
        .add-course-section { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 30px; margin-bottom: 40px; }
        .add-course-section h2 { margin-bottom: 20px; font-size: 1.4rem; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; color: #e2e8f0; font-size: 0.95rem; outline: none; }
        input:focus, select:focus { border-color: #7c3aed; }
        button[type="submit"] { padding: 12px 24px; background: linear-gradient(135deg, #7c3aed, #06b6d4); border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        button[type="submit"]:hover { opacity: 0.9; }

        .courses-table-container { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.08); }
        th { background: rgba(255,255,255,0.02); font-weight: 600; color: #94a3b8; }
        tr:hover { background: rgba(255,255,255,0.02); }
        .platform-badge { padding: 4px 10px; border-radius: 999px; font-size: 0.8rem; background: rgba(124,58,237,0.15); color: #a78bfa; }
        .btn-delete { color: #ef4444; text-decoration: none; font-weight: 600; padding: 6px 12px; background: rgba(239,68,68,0.1); border-radius: 6px; transition: background 0.2s; }
        .btn-delete:hover { background: rgba(239,68,68,0.2); }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h1>Admin Dashboard</h1>
            <a href="/" class="btn-logout"><i class="fas fa-home"></i> Back to Hub</a>
        </div>

        <div class="add-course-section">
            <h2><i class="fas fa-plus-circle"></i> Add New Course</h2>
            <form method="POST" action="/admin/add">
                <div class="form-grid">
                    <input type="text" name="title" placeholder="Course Title" required>
                    <select name="platform" required>
                        <option value="" disabled selected>Select Platform</option>
                        <option value="Udemy">Udemy</option>
                        <option value="Coursera">Coursera</option>
                        <option value="GeeksforGeeks">GeeksforGeeks</option>
                        <option value="YouTube">YouTube</option>
                        <option value="NPTEL">NPTEL</option>
                        <option value="Microsoft Learn">Microsoft Learn</option>
                    </select>
                    <input type="url" name="link" placeholder="Course URL" required>
                    <input type="text" name="tags" placeholder="Tags (e.g., 'web free cert')">
                    <input type="text" name="icon" placeholder="Emoji Icon (e.g., 🌐)">
                    <select name="badge_type">
                        <option value="Free">Free</option>
                        <option value="Paid">Paid</option>
                    </select>
                </div>
                <button type="submit">Add Course</button>
            </form>
        </div>

        <div class="courses-table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Platform</th>
                        <th>Type</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for course in courses %}
                    <tr>
                        <td>#{{ course.id }}</td>
                        <td><strong>{{ course.title }}</strong></td>
                        <td><span class="platform-badge">{{ course.platform }}</span></td>
                        <td>{{ course.badge_type }}</td>
                        <td>
                            <a href="{{ course.link }}" target="_blank" style="color: #06b6d4; margin-right: 15px; text-decoration: none;" title="Open"><i class="fas fa-external-link-alt"></i></a>
                            <a href="/admin/edit/{{ course.id }}" style="color: #f59e0b; margin-right: 15px; text-decoration: none;" title="Edit"><i class="fas fa-edit"></i> Edit</a>
                            <a href="/admin/delete/{{ course.id }}" class="btn-delete"><i class="fas fa-trash"></i> Delete</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
